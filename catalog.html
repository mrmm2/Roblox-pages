<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
        body { background:#0b0e1a; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
        .container { background:#1a1e2f; border-radius:36px; padding:30px; max-width:500px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.8); border:1px solid #2a2f4a; text-align:center; }
        h1 { color:#f7d44a; font-size:26px; margin-bottom:5px; }
        .sub { color:#7a7fa0; font-size:13px; margin-bottom:18px; }
        .balance { display:flex; justify-content:center; gap:20px; background:#0f1326; border-radius:20px; padding:12px; margin-bottom:18px; border:1px solid #282e4a; }
        .balance-item { text-align:center; }
        .balance-item .label { font-size:11px; color:#7a7fa0; }
        .balance-item .value { font-size:22px; font-weight:800; }
        .value.robux { color:#f7d44a; }
        .value.yana { color:#5fcbff; }
        .item { background:#0f1326; border:1px solid #282e4a; border-radius:20px; padding:15px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
        .item .info { text-align:left; }
        .item .info .name { font-weight:700; color:#fff; font-size:18px; }
        .item .info .desc { font-size:13px; color:#7a7fa0; }
        .item button { background:#f7d44a; border:none; padding:10px 20px; border-radius:40px; font-weight:700; font-size:16px; cursor:pointer; transition:0.2s; color:#0b0e1a; }
        .item button:disabled { background:#3a3f5e; color:#6a6f8a; cursor:not-allowed; }
        .item button:active:not(:disabled) { transform:scale(0.95); }
        .menu a { display:inline-block; margin-top:16px; color:#5fcbff; text-decoration:none; font-weight:600; }
        .menu a:hover { color:#f7d44a; }
        .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#1a1e3a; border:1px solid #5fcbff; color:#fff; padding:10px 28px; border-radius:60px; font-weight:600; font-size:16px; box-shadow:0 8px 30px rgba(0,0,0,0.6); opacity:0; transition:0.4s; pointer-events:none; z-index:999; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    </style>
</head>
<body>
<div class="container">
    <h1>🛒 Каталог</h1>
    <div class="sub">Покупай предметы за Robux</div>

    <div class="balance">
        <div class="balance-item">
            <div class="label">💰 Robux</div>
            <div class="value robux" id="robuxDisplay">0</div>
        </div>
        <div class="balance-item">
            <div class="label">🌟 Яны</div>
            <div class="value yana" id="yanaDisplay">0</div>
        </div>
    </div>

    <div id="catalog">
        <div class="item">
            <div class="info">
                <div class="name">🎩 Шляпа</div>
                <div class="desc">Классный головной убор</div>
            </div>
            <button data-price="50">50 Robux</button>
        </div>
        <div class="item">
            <div class="info">
                <div class="name">⚔️ Меч</div>
                <div class="desc">Для битв и приключений</div>
            </div>
            <button data-price="80">80 Robux</button>
        </div>
        <div class="item">
            <div class="info">
                <div class="name">🚀 Ракетный ранец</div>
                <div class="desc">Летай по миру</div>
            </div>
            <button data-price="150">150 Robux</button>
        </div>
        <div class="item">
            <div class="info">
                <div class="name">🏠 Домик</div>
                <div class="desc">Уютное жильё</div>
            </div>
            <button data-price="300">300 Robux</button>
        </div>
    </div>

    <div class="menu">
        <a href="index.html">🏠 На главную</a>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    let robux = parseInt(localStorage.getItem('robux')) || 0;
    let yana = parseInt(localStorage.getItem('yana')) || 0;

    function updateUI() {
        document.getElementById('robuxDisplay').textContent = robux;
        document.getElementById('yanaDisplay').textContent = yana;
        localStorage.setItem('robux', robux);
        localStorage.setItem('yana', yana);
    }

    function showToast(text) {
        const toast = document.getElementById('toast');
        toast.textContent = text;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    document.querySelectorAll('#catalog .item button').forEach(btn => {
        btn.addEventListener('click', function() {
            const price = parseInt(this.dataset.price);
            const itemName = this.closest('.item').querySelector('.name').textContent;

            if (robux < price) {
                showToast(`❌ Не хватает Robux! Нужно ${price}, у тебя ${robux}`);
                return;
            }

            robux -= price;
            updateUI();
            showToast(`✅ Куплено: ${itemName} (списано ${price} Robux)`);
        });
    });

    updateUI();
</script>
</body>
</html>
